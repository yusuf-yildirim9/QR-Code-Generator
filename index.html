<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>QR CODE GENERATOR</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="title-wrapper">
                <h1 class="title">QR Code Generator</h1>
                <p class="desc">Create a QR code instantly by entering text, a URL, or Wi-Fi information.</p>
            </div>
            <div class="content-wrapper">
                <section class="info-section">
                    <div class="tab-container">
                        <button class="tab-btn active">
                            <i class="fa-solid fa-link"></i>
                            <span>URL / LINK</span>
                        </button>
                        <button class="tab-btn">
                            <i class="fa-regular fa-note-sticky"></i>
                            <span>TEXT</span>
                        </button>
                        <button class="tab-btn">
                            <i class="fa-solid fa-wifi"></i>
                            <span>Wi-Fi</span>
                        </button>
                    </div>
                    <form class="tab-contents">
                        <div class="tab-content active" id="url-content">
                            <div class="input-group">
                                <i class="fa-solid fa-globe"></i>
                                <input type="url" id="urlInput" placeholder="https://example.com" />
                            </div>
                        </div>
                        <div class="tab-content" id="text-content">
                            <div class="input-group">
                                <textarea id="textInput" placeholder="Text here..."></textarea>
                            </div>
                        </div>
                        <div class="tab-content" id="wifi-content">
                            <div class="wifi-inputs">
                                <input type="text" id="ssidInput" placeholder="Network Name (SSID)" />
                                <input type="password" id="passInput" placeholder="Password" />
                            </div>
                        </div>

                        <button id="generateBtn" class="generate-btn">Generate QR Code</button>
                    </form>
                </section>
                <section class="qr-preview-wrapper">
                    <div class="qrcode-box" id="qrcode">
                        <div id="qrPlaceholder" class="qr-placeholder">
                            <i class="fa-solid fa-qrcode"></i>
                            <p>No QR code has been created yet</p>
                        </div>
                    </div>
                    <button id="downloadBtn" class="download-btn">
                        <i class="fa-solid fa-download"></i>
                        <span>Download as PNG</span> 
                    </button>
                </section>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
